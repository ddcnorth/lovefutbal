<style>
/* Layout: a floodlit scoreboard for a public screen. World totals across the top, every game below as its own small pitch with a headcount. Single dark look by choice. */
:root{
  color-scheme:dark;
  --night:#1D1D1B; --paper:#F5F4EF; --green:#489D60; --mint:#88C59B; --clay:#D17F2D; --sky:#3CB1EA; --flag:#ED1C24;
  --panel:#272724; --rule:rgba(245,244,239,.2); --soft:rgba(245,244,239,.7);
  --display:"Bahianita","Arial Narrow","Helvetica Neue Condensed",Impact,sans-serif;
  --text:"Red Hat Text","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--night);color:var(--paper);font:400 18px/1.45 var(--text);-webkit-font-smoothing:antialiased}
.wrap{max-width:1440px;margin-inline:auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2{font-family:var(--display);font-weight:400;margin:0}
.num{font-variant-numeric:tabular-nums}
.proto{font-size:14px;color:var(--soft);margin:0 0 16px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:16px 32px}
.logo{width:144px;color:var(--paper);flex:none}
.logo svg{display:block;width:100%;height:auto}
.top h1{font-size:clamp(48px,6vw,80px);line-height:.9}
.livedot{display:inline-block;width:.28em;height:.28em;border-radius:50%;background:var(--flag);margin-right:.25em;vertical-align:.18em;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(237,28,36,.6)}100%{box-shadow:0 0 0 14px rgba(237,28,36,0)}}
.clock{margin-left:auto;font:400 clamp(40px,5vw,64px)/1 var(--display);font-variant-numeric:tabular-nums}
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:24px;border-block:2px solid var(--paper);padding-block:12px 16px}
.fig{overflow:hidden}
.fig b{display:block;font:400 clamp(110px,17vw,270px)/.8 var(--display);font-variant-numeric:tabular-nums}
.fig:nth-child(1) b{color:var(--mint)}.fig:nth-child(3) b{color:var(--sky)}
.fig span{display:block;font-weight:500;font-size:clamp(16px,1.5vw,22px);margin-top:8px}
.totals{display:flex;flex-wrap:wrap;gap:6px 40px;margin-top:14px;color:var(--soft)}
.totals b{color:var(--paper);font-weight:700;font-variant-numeric:tabular-nums}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:20px;margin-top:28px}
.game{background:var(--panel);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
.game header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.game h2{font-size:38px;line-height:.9}
.game header p{margin:2px 0 0;font-size:15px;color:var(--soft)}
.head{text-align:right;flex:none}
.head b{display:block;font:400 76px/.78 var(--display);font-variant-numeric:tabular-nums}
.head span{display:block;margin-top:6px;font-size:14px;color:var(--soft)}
.line{display:flex;justify-content:space-between;gap:12px;font-size:16px}
.line b{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{background:var(--clay)}100%{background:var(--panel)}}
.pitch{display:block;width:100%;height:auto;overflow:visible}
.turf{fill:var(--green)}
.lines *{fill:none;stroke:var(--paper);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;animation:draw 1s ease-out both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.pole{stroke:var(--paper);stroke-width:1.4;stroke-linecap:round}
.flagc{fill:var(--flag)}
.pl{transition:transform 1s ease-in-out,opacity .5s;stroke:var(--night);stroke-width:1}
.pl.a{fill:var(--night)}.pl.b{fill:var(--clay)}
.ball{fill:#fff;stroke:var(--night);stroke-width:1.1;transition:transform .55s cubic-bezier(.2,.7,.3,1)}
@media (max-width:560px){.figs{grid-template-columns:minmax(0,1fr);gap:4px}.fig{display:flex;align-items:baseline;gap:16px}.fig b{font-size:96px;min-width:1.6em}.clock{margin-left:0}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>

<script>
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
function rng(s){return()=>(s=(s*1664525+1013904223)>>>0)/4294967296}
function Pitch(host,o){
  const r=rng(o.seed||7),n=o.n||5,id='wob'+(o.seed||7);
  host.innerHTML=`<svg class="pitch" viewBox="-8 -14 216 140" role="img" aria-label="${o.label||'A game in progress, seen from above'}">
  <defs><filter id="${id}" x="-5%" y="-8%" width="110%" height="116%"><feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="2" seed="${o.seed||7}"/><feDisplacementMap in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G"/></filter></defs>
  <rect class="turf" width="200" height="120" rx="2" filter="url(#${id})"/>
  <g class="lines" filter="url(#${id})"><path pathLength="1" d="M0 0H200V120H0Z"/><path pathLength="1" d="M100 0V120"/><circle pathLength="1" cx="100" cy="60" r="17"/><path pathLength="1" d="M0 30H28V90H0"/><path pathLength="1" d="M200 30H172V90H200"/><path pathLength="1" d="M0 47H-5V73H0"/><path pathLength="1" d="M200 47H205V73H200"/></g>
  <path class="pole" d="M200 1V-11"/><path class="flagc" d="M200-11l9 2.6-9 3.4z"/><g class="men"></g></svg>`;
  const men=host.querySelector('.men'),P=[];
  const put=(el,x,y)=>el.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
  for(let t=0;t<2;t++)for(let i=0;i<=n;i++){
    const out=n-1,cols=Math.ceil(out/2),k=i-1,col=k>>1;
    let hx=i?36+col*(56/Math.max(cols,1)):11,hy=i?(k%2?86:34):60;
    if(i&&k===out-1&&out%2)hy=60;
    if(i===n){hx=60;hy=60}
    if(t)hx=200-hx;
    const el=document.createElementNS(NS,'circle');el.setAttribute('r',3.8);el.setAttribute('class','pl '+(t?'b':'a'));
    const p={t,i,hx,hy,x:hx,y:132,on:i<n,el};men.appendChild(el);
    el.style.opacity=0;put(el,hx,132);P.push(p);
  }
  const ball=document.createElementNS(NS,'circle');ball.setAttribute('r',2.3);ball.setAttribute('class','ball');men.appendChild(ball);put(ball,100,60);
  let holder=P[1],bx=100,by=60,score=[...(o.score||[0,0])];
  function step(){
    const on=P.filter(p=>p.on),mates=on.filter(p=>p.t===holder.t&&p!==holder),opp=on.filter(p=>p.t!==holder.t);
    const adv=holder.t?holder.x<78:holder.x>122;let shot=false;
    if(adv&&r()<.34){
      shot=true;const goal=r()<.3;bx=holder.t?(goal?-2:5):(goal?202:195);by=52+r()*16;
      if(goal){score[holder.t]++;o.onGoal&&o.onGoal(score)}
      holder=opp.find(p=>!p.i)||opp[0];
    }else if(r()<.2&&opp.length)holder=opp[r()*opp.length|0];
    else if(mates.length){const a=mates[r()*mates.length|0],b=mates[r()*mates.length|0];holder=(holder.t?a.x<b.x:a.x>b.x)?a:b}
    const tx=shot?bx:holder.hx+(holder.t?-14:14);
    on.forEach(p=>{
      const f=p.i?.3:.05;
      p.x=Math.max(5,Math.min(195,p.hx+(tx-100)*f+(r()-.5)*(p.i?16:3)+(p===holder&&!shot?(p.t?-12:12):0)));
      p.y=Math.max(6,Math.min(114,p.hy+((shot?60:holder.hy)-p.hy)*(p.i?.2:.1)+(r()-.5)*(p.i?18:8)));
      p.el.style.opacity=1;put(p.el,p.x,p.y);
    });
    if(!shot){bx=holder.x+(holder.t?-4:4);by=holder.y+2}
    put(ball,bx,by);
  }
  function toggle(){
    const t=r()<.5?0:1,team=P.filter(p=>p.t===t),on=team.filter(p=>p.on),off=team.filter(p=>!p.on);
    if(off.length&&(on.length<n||r()<.5)){off[0].on=true}
    else{const p=on[on.length-1];if(p.i){p.on=false;p.el.style.opacity=0;put(p.el,p.hx,132)}}
    return count();
  }
  const count=()=>P.filter(p=>p.on).length;
  if(still){P.forEach(p=>{if(p.on){p.el.style.opacity=1;put(p.el,p.hx,p.hy)}})}
  else{setTimeout(()=>{step();setInterval(step,1050)},o.delay??1300)}
  return{count,toggle};
}

const GAMES=[
 {site:'Campo da Várzea',city:'Recife, Brazil',a:'Várzea Unidos',b:'Leões do Capibaribe',n:5,s:[2,1]},
 {site:'Cancha La Esperanza',city:'Mexico City, Mexico',a:'Barrio Norte',b:'Las Águilas',n:7,s:[0,0]},
 {site:'Cancha El Mirador',city:'Bogotá, Colombia',a:'Mirador FC',b:'Los Vecinos',n:5,s:[3,3]},
 {site:'Cancha Villa Nueva',city:'Guatemala City, Guatemala',a:'Villa Nueva',b:'Santa Fe',n:6,s:[1,0]},
 {site:'Potrero San Martín',city:'Buenos Aires, Argentina',a:'Los Pibes',b:'Club Unión',n:5,s:[4,2]},
 {site:'Eastside Community Pitch',city:'Houston, United States',a:'Eastside United',b:'Third Ward FC',n:7,s:[1,1]}
];
const WORLD={games:19,other:151,today:1284,goals:312};
const lr=rng(42);
function setNum(el,v){v=String(v);if(el.textContent===v)return;el.textContent=v;
  if(!still&&el.animate)el.animate([{transform:'translateY(.3em)',opacity:.3},{transform:'none',opacity:1}],{duration:350,easing:'ease-out'})}
GAMES.forEach((g,i)=>{
  const el=document.createElement('article');el.className='game';
  el.innerHTML=`<header><div><h2>${g.site}</h2><p>${g.city}</p></div><div class="head"><b class="c">0</b><span>players</span></div></header><div class="p"></div><div class="line"><span>${g.a}</span><b class="s"></b><span>${g.b}</span></div>`;
  $('games').appendChild(el);g.el=el;
  g.pitch=Pitch(el.querySelector('.p'),{n:g.n,seed:i*13+5,score:g.s,delay:900+i*170,label:`${g.a} against ${g.b}, seen from above`,
    onGoal:s=>{g.s=[...s];WORLD.goals++;el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');paint()}});
  g.c=g.pitch.count();
});
function paint(){
  GAMES.forEach(g=>{setNum(g.el.querySelector('.c'),g.c);g.el.querySelector('.s').textContent=g.s[0]+'–'+g.s[1]});
  setNum($('fGames'),WORLD.games);setNum($('fTeams'),WORLD.games*2);
  setNum($('fPlayers'),GAMES.reduce((a,g)=>a+g.c,0)+WORLD.other);
  setNum($('tToday'),WORLD.today.toLocaleString('en-GB'));setNum($('tGoals'),WORLD.goals);
}
function clock(){$('clock').textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}
paint();clock();setInterval(clock,10000);
if(!still)setInterval(()=>{
  const g=GAMES[lr()*GAMES.length|0];g.c=g.pitch.toggle();
  WORLD.other=Math.max(120,Math.min(190,WORLD.other+((lr()*5|0)-2)));
  if(lr()<.5)WORLD.today+=1+(lr()*3|0);
  if(lr()<.1){const d=lr()<.5?-1:1;WORLD.games=Math.max(16,Math.min(23,WORLD.games+d));WORLD.other+=d*10}
  paint();
},2400);
</script>
